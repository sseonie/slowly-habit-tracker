<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slowly · Habit Tracker</title>
  <style>
    :root { --ink:#2e3943; --muted:#8d969c; --line:#e6e5df; --paper:#fbfaf6; --blue:#647889; --blue-soft:#e8eef0; --sand:#f1eee6; --white:#fffefa; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:#f2f1ec; color:var(--ink); font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif; font-size:16px; line-height:1.35; font-synthesis:none; }
    button,input,textarea,select { font:inherit; } button { cursor:pointer; border:0; color:inherit; }
    .app { max-width:720px; min-height:100vh; margin:auto; padding:34px 24px 92px; background:var(--paper); }
    .topbar { display:flex; align-items:center; justify-content:space-between; } .brand { font-size:14px; letter-spacing:.12em; color:var(--muted); } .overview-btn { background:none; color:var(--blue); font-size:14px; padding:8px 0; }
    h1 { margin:40px 0 7px; font-size:31px; letter-spacing:-.045em; } .date { color:var(--muted); font-size:14px; } .quote { margin:29px 0 25px; font-size:16px; color:#667078; }
    .habit-list { display:grid; gap:10px; } .habit { display:flex; align-items:center; gap:15px; width:100%; text-align:left; padding:14px 15px; background:var(--white); border:1px solid transparent; border-radius:18px; box-shadow:0 2px 12px #313b4210; transition:.18s; } .habit:hover { border-color:#d9e0e2; transform:translateY(-1px); }
    .emoji { display:grid; place-items:center; flex:0 0 45px; height:45px; border-radius:15px; background:var(--sand); font-size:23px; } .habit-name { font-size:17px; font-weight:600; } .habit-note { margin-top:3px; color:var(--muted); font-size:13px; line-height:1.3; } .check { margin-left:auto; display:grid; place-items:center; width:29px; height:29px; border:1.7px solid #ced3d2; border-radius:50%; color:white; font-weight:700; transition:.18s; } .habit.done .check { background:var(--blue); border-color:var(--blue); } .habit.done .emoji { background:var(--blue-soft); }
    .add { width:100%; margin-top:21px; padding:14px; border:1px dashed #cdd3d2; border-radius:15px; background:transparent; color:var(--blue); }
    .sheet { position:fixed; z-index:5; inset:0; display:none; align-items:end; justify-content:center; background:#26333a33; } .sheet.show { display:flex; } .panel { width:min(720px,100%); max-height:92vh; overflow:auto; padding:25px 24px 29px; border-radius:24px 24px 0 0; background:var(--paper); box-shadow:0 -8px 32px #2225; } .panel-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; } .panel h2 { margin:0; font-size:22px; } .close { background:none; color:var(--muted); font-size:22px; }
    label { display:block; margin:16px 0 7px; font-size:14px; color:#687179; } input,textarea,select { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:12px; outline:none; background:var(--white); color:var(--ink); } textarea { min-height:70px; resize:vertical; } input:focus,textarea:focus,select:focus { border-color:var(--blue); } .form-row { display:grid; grid-template-columns:88px 1fr; gap:10px; }
    .primary { width:100%; margin-top:23px; padding:14px; border-radius:14px; background:var(--blue); color:white; } .danger { margin-top:13px; width:100%; padding:12px; background:transparent; color:#a56060; }
    .detail-title { display:flex; gap:12px; align-items:center; } .detail-title .emoji { width:50px; height:50px; font-size:26px; } .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:22px 0 28px; } .stat { padding:13px 10px; border-radius:13px; background:#f1f2ee; text-align:center; } .stat b { display:block; font-size:17px; } .stat span { display:block; margin-top:4px; font-size:11px; color:var(--muted); }
    .month-nav { display:flex; align-items:center; justify-content:space-between; margin:5px 0 17px; font-size:16px; } .nav-arrow { width:34px; height:32px; border-radius:10px; background:#f0f1ed; } .week,.calendar { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; gap:7px; } .week { margin-bottom:9px; color:var(--muted); font-size:11px; } .day { aspect-ratio:1; display:grid; place-items:center; position:relative; padding:0; font-size:13px; border-radius:50%; background:transparent; } .day:not(.empty):not(:disabled) { cursor:pointer; } .day.empty { visibility:hidden; } .day.completed { background:var(--accent,var(--blue)); color:#fff; } .day.today:not(.completed) { outline:1.5px solid var(--blue); outline-offset:-1.5px; } .day.future,.day:disabled { color:#c7cbcb; } .calendar-label { margin:28px 0 12px; color:var(--muted); font-size:12px; }
    .overview-grid { overflow-x:auto; } table { width:100%; min-width:570px; border-collapse:separate; border-spacing:0 7px; font-size:12px; } th { padding:0 4px 7px; color:var(--muted); font-weight:500; } td { height:31px; text-align:center; background:#f0f1ed; } td:first-child { width:100px; padding:0 10px; border-radius:10px 0 0 10px; text-align:left; white-space:nowrap; } td:last-child { border-radius:0 10px 10px 0; } td.complete-cell { background:var(--blue); color:white; font-weight:700; } .overview-month { margin:1px 0 20px; color:var(--muted); }
    .screen { display:none; } .screen.active { display:block; } .records-head { display:flex; gap:16px; align-items:baseline; margin:28px 0 31px; } .records-head .muted { color:#a2a8aa; font-size:18px; } .records-head h1 { margin:0; font-size:38px; }
    .summary-title { font-size:18px; margin-bottom:16px; } .summary-card { display:grid; grid-template-columns:repeat(3,1fr); padding:21px 0; border-radius:27px; background:var(--white); box-shadow:0 2px 12px #313b420b; } .summary-item { text-align:center; border-left:1px solid var(--line); } .summary-item:first-child { border-left:0; } .summary-item span { display:block; color:#a4aaac; font-size:12px; } .summary-item b { display:block; margin-top:11px; font-size:29px; letter-spacing:-.04em; }
    .record-list { margin-top:38px; border-top:1px solid var(--line); } .record-card { padding:28px 0 24px; border-bottom:1px solid var(--line); } .record-title { display:flex; align-items:center; gap:13px; } .record-mark { width:13px; height:43px; border-radius:9px; background:var(--blue); } .record-title h2 { margin:0; font-size:27px; letter-spacing:-.04em; } .record-year { margin-left:auto; color:var(--muted); font-size:13px; } .mini-months { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:25px 11px 23px 42px; } .mini-month { text-align:center; min-width:0; padding:0; background:none; } .mini-month label { margin:0 0 11px; font-size:12px; font-weight:600; color:#757e84; } .dot-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; } .dot { aspect-ratio:1; padding:0; border-radius:50%; background:#e7e8e4; } .dot.done { background:var(--accent,var(--blue)); } .dot.future { background:#f0f1ee; pointer-events:none; } .record-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; text-align:center; } .record-stats span { display:block; color:#a1a7a8; font-size:11px; white-space:nowrap; } .record-stats b { display:block; margin-top:8px; font-size:20px; } .palette { display:grid; grid-template-columns:repeat(7,1fr); gap:10px; } .swatch { width:100%; aspect-ratio:1; padding:0; border-radius:50%; background:var(--swatch); box-shadow:inset 0 0 0 1px #00000012; } .swatch.selected { outline:2px solid var(--ink); outline-offset:2px; }
    .week-title { margin-bottom:4px; } .week-subtitle { color:var(--muted); font-size:14px; } .week-head { display:flex; align-items:center; gap:12px; } .week-head .close { margin-left:4px; } .week-head-copy { flex:1; } .week-calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:9px; margin-top:18px; } .week-day { display:grid; justify-items:center; gap:9px; color:var(--muted); font-size:12px; } .week-day button { display:grid; place-items:center; width:34px; height:34px; border-radius:50%; background:#eef0ed; color:var(--ink); } .week-day button.done { background:var(--accent,var(--blue)); color:white; }
    .bottom-nav { position:fixed; z-index:3; bottom:0; left:50%; width:min(720px,100%); transform:translateX(-50%); display:flex; justify-content:space-around; padding:10px 18%; border-top:1px solid #ecece7; background:#fffefaf2; backdrop-filter:blur(12px); } .tab { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:58px; padding:5px; background:none; color:#a7adae; font-size:11px; } .tab-icon { width:23px; height:23px; display:grid; place-items:center; border:1.5px solid currentColor; border-radius:7px; font-size:14px; } .tab.active { color:var(--ink); font-weight:700; } .tab.active .tab-icon { background:var(--ink); color:white; }
    @media(max-width:480px){.app{padding:26px 18px 88px}.stats{gap:6px}.stat{padding:12px 5px}.panel{padding-left:18px;padding-right:18px}.mini-months{margin-left:23px;gap:8px}.dot-grid{gap:4px}.record-title h2{font-size:24px}.record-stats b{font-size:18px}}
  </style>
</head>
<body><main class="app">
  <section class="screen active" id="homeScreen">
  <header class="topbar"><span class="brand">SLOWLY</span><button class="overview-btn" id="openOverview">Month view</button></header>
  <h1 id="todayTitle"></h1><div class="date" id="todayDate"></div><p class="quote">Take today at your own pace.</p>
  <section class="habit-list" id="habitList"></section><button class="add" id="addHabit">＋ Add a habit</button></section>
  <section class="screen" id="recordsScreen"><div class="records-head"><span class="muted">Calendar</span><h1>Records</h1></div><div class="summary-title">This month</div><div class="summary-card" id="summaryCard"></div><div class="record-list" id="recordList"></div></section>
</main>
<nav class="bottom-nav"><button class="tab active" data-tab="home"><span class="tab-icon">⌂</span><span>Home</span></button><button class="tab" data-tab="records"><span class="tab-icon">≡</span><span>Records</span></button></nav>

<div class="sheet" id="formSheet"><form class="panel" id="habitForm"><div class="panel-head"><h2 id="formTitle">New habit</h2><button class="close" type="button" data-close="formSheet">×</button></div>
  <input type="hidden" id="habitId"><div class="form-row"><div><label for="emoji">Emoji</label><input id="emoji" maxlength="4" value="🌿" aria-label="Emoji icon"></div><div><label for="name">Habit name</label><input id="name" required placeholder="e.g. Read"></div></div>
  <label for="frequency">Frequency</label><select id="frequency"><option value="daily">Every day</option><option value="weekdays">Weekdays</option><option value="custom">Custom days</option></select>
  <label>Record colour</label><input id="color" type="hidden" value="#647889"><div class="palette" id="colorPalette" aria-label="Record colour"></div>
  <label for="note">Note (optional)</label><textarea id="note" placeholder="Write a gentle little goal"></textarea><button class="primary" type="submit">Save habit</button><button class="danger" type="button" id="deleteHabit" hidden>Delete this habit</button></form></div>

<div class="sheet" id="detailSheet"><section class="panel"><div class="panel-head"><div class="detail-title"><div class="emoji" id="detailEmoji"></div><div><h2 id="detailName"></h2><span id="detailFrequency" class="date"></span></div></div><button class="close" data-close="detailSheet">×</button></div><div class="stats" id="stats"></div><div class="month-nav"><button class="nav-arrow" id="prevMonth">‹</button><b id="monthName"></b><button class="nav-arrow" id="nextMonth">›</button></div><div class="week"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="calendar" id="calendar"></div><div class="calendar-label">Tap an available day to update its check-in.</div><button class="add" id="editHabit">Edit habit</button><button class="danger" id="deleteFromDetail">Delete habit</button></section></div>

<div class="sheet" id="weekSheet"><section class="panel"><div class="panel-head week-head"><button class="nav-arrow" id="prevWeek" aria-label="Previous week">‹</button><div class="week-head-copy"><h2 class="week-title" id="weekHabitName"></h2><span class="week-subtitle" id="weekRange"></span></div><button class="nav-arrow" id="nextWeek" aria-label="Next week">›</button><button class="close" data-close="weekSheet">×</button></div><div class="week"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="week-calendar" id="weekCalendar"></div><p class="calendar-label">Tap a day to update its check-in.</p></section></div>

<div class="sheet" id="overviewSheet"><section class="panel"><div class="panel-head"><h2>Month overview</h2><button class="close" data-close="overviewSheet">×</button></div><p class="overview-month" id="overviewMonth"></p><div class="overview-grid"><table id="overviewTable"></table></div></section></div>

<script>
const key='slowly-habits-v1'; const today=new Date(); let shownMonth=new Date(today.getFullYear(),today.getMonth(),1), activeId=null;
const defaults=[{id:'read',emoji:'📚',name:'Read',frequency:'daily',note:'Read a little each day',color:'#BD7877',dates:[]},{id:'journal',emoji:'✍️',name:'Journal',frequency:'daily',note:'A note about today',color:'#667F7A',dates:[]},{id:'stretch',emoji:'🧘',name:'Stretch',frequency:'daily',note:'',color:'#95A86E',dates:[]},{id:'run',emoji:'🏃',name:'Move',frequency:'weekdays',note:'',color:'#58677F',dates:[]}];
let habits=JSON.parse(localStorage.getItem(key)||'null')||defaults; const fallbackColors=['#BD7877','#667F7A','#95A86E','#58677F','#CE7C4B']; const neutralColors=['#9E554A','#BD7877','#CE7C4B','#E8D09A','#95A86E','#5D6748','#667F7A','#84A5A8','#4A5D6B','#58677F','#9895AF','#C49399','#D7ACAB','#E8CDD3','#A34D57','#C66166','#D98F5E','#E8B66B','#DCC675','#A8B76B','#729867','#4F7968','#427B86','#4C7199','#6767A1','#886DA4','#AA7195','#B87978']; const demoTranslations={read:['Read','Read a little each day'],journal:['Journal','A note about today'],stretch:['Stretch',''],run:['Move','']};habits.forEach((h,i)=>{if(!h.color||!neutralColors.includes(h.color.toUpperCase()))h.color=fallbackColors[i%fallbackColors.length];if(demoTranslations[h.id]&&(h.name==='阅读'||h.name==='日记'||h.name==='拉伸'||h.name==='运动')){h.name=demoTranslations[h.id][0];h.note=demoTranslations[h.id][1]}}); const $=s=>document.querySelector(s); const pad=n=>String(n).padStart(2,'0'); const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; const nowKey=dateKey(today); let activeWeek=null;
function save(){localStorage.setItem(key,JSON.stringify(habits))} function fmt(d){return new Intl.DateTimeFormat('en-US',{year:'numeric',month:'long'}).format(d)} function isDue(h,d){if(d>today)return false; if(h.frequency==='weekdays'&&(d.getDay()===0||d.getDay()===6))return false; return true} function renderPalette(){let active=$('#color').value;$('#colorPalette').innerHTML=neutralColors.map(c=>`<button type="button" class="swatch ${c.toLowerCase()===active.toLowerCase()?'selected':''}" style="--swatch:${c}" data-color="${c}" aria-label="Choose ${c}"></button>`).join('')} function setColor(c){$('#color').value=c;renderPalette()}
function seed(){ if(localStorage.getItem(key))return; habits.forEach((h,ix)=>{for(let n=1;n<today.getDate();n++) if((n+ix*2)%4!==0){let d=new Date(today.getFullYear(),today.getMonth(),n);if(isDue(h,d))h.dates.push(dateKey(d))}});save()} seed();
function renderHome(){ $('#todayTitle').textContent=new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric'}).format(today); $('#todayDate').textContent=new Intl.DateTimeFormat('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(today); $('#habitList').innerHTML=habits.map(h=>{let done=h.dates.includes(nowKey);return `<button class="habit ${done?'done':''}" data-id="${h.id}"><span class="emoji">${h.emoji}</span><span><span class="habit-name">${h.name}</span>${h.note?`<span class="habit-note">${h.note}</span>`:''}</span><span class="check">${done?'✓':''}</span></button>`}).join(''); }
function toggle(id){toggleDate(id,nowKey)} function toggleDate(id,iso){let h=habits.find(x=>x.id===id),i=h.dates.indexOf(iso);i<0?h.dates.push(iso):h.dates.splice(i,1);save();renderHome();renderRecords();if(activeId===id)renderDetail();if(activeWeek)openWeek(activeWeek.id,activeWeek.iso)}
function open(id){activeId=id;shownMonth=new Date(today.getFullYear(),today.getMonth(),1);renderDetail();show('detailSheet')}
function renderDetail(){let h=habits.find(x=>x.id===activeId); if(!h)return; $('#detailEmoji').textContent=h.emoji;$('#detailName').textContent=h.name;$('#detailFrequency').textContent=h.frequency==='daily'?'Daily':h.frequency==='weekdays'?'Weekdays':'Custom days';let year=shownMonth.getFullYear(),month=shownMonth.getMonth(),days=new Date(year,month+1,0).getDate(), start=(new Date(year,month,1).getDay()+6)%7;$('#monthName').textContent=fmt(shownMonth);let total=0,done=0;for(let n=1;n<=days;n++){let d=new Date(year,month,n);if(isDue(h,d)){total++;if(h.dates.includes(dateKey(d)))done++}}let streak=0;for(let d=new Date(today);;d.setDate(d.getDate()-1)){if(!isDue(h,d))continue;if(h.dates.includes(dateKey(d)))streak++;else break}$('#stats').innerHTML=`<div class="stat"><b>${h.dates.includes(nowKey)?'Done':'Not done'}</b><span>Today</span></div><div class="stat"><b>${streak} days</b><span>Current streak</span></div><div class="stat"><b>${total?Math.round(done/total*100):0}%</b><span>Month complete</span></div>`;let cells=Array(start).fill('<span class="day empty"></span>');for(let n=1;n<=days;n++){let d=new Date(year,month,n),cls='day',disabled=d>today||!isDue(h,d);if(h.dates.includes(dateKey(d)))cls+=' completed';if(dateKey(d)===nowKey)cls+=' today';if(d>today)cls+=' future';cells.push(`<button class="${cls}" data-month-date="${dateKey(d)}" ${disabled?'disabled':''}>${n}</button>`)}$('#calendar').style.setProperty('--accent',h.color);$('#calendar').innerHTML=cells.join('');}
function renderOverview(){let y=today.getFullYear(),m=today.getMonth(),days=new Date(y,m+1,0).getDate();$('#overviewMonth').textContent=fmt(today);let display=Array.from({length:Math.min(days,14)},(_,i)=>i+1);$('#overviewTable').innerHTML=`<thead><tr><th>Habit</th>${display.map(n=>`<th>${n}</th>`).join('')}</tr></thead><tbody>${habits.map(h=>`<tr><td>${h.emoji} ${h.name}</td>${display.map(n=>{let d=new Date(y,m,n),done=h.dates.includes(dateKey(d));return `<td class="${done?'complete-cell':''}">${done?'✓':isDue(h,d)?'○':'·'}</td>`}).join('')}</tr>`).join('')}</tbody>`}
function streakFor(h){let streak=0;for(let d=new Date(today);;d.setDate(d.getDate()-1)){if(!isDue(h,d))continue;if(h.dates.includes(dateKey(d)))streak++;else break}return streak}
function recordMetrics(h){let y=today.getFullYear(),m=today.getMonth(),possible=0,done=0;for(let n=1;n<=today.getDate();n++){let d=new Date(y,m,n);if(isDue(h,d)){possible++;if(h.dates.includes(dateKey(d)))done++}}return {possible,done,rate:possible?Math.round(done/possible*100):0,current:streakFor(h)}}
function miniMonth(h,offset){let d=new Date(today.getFullYear(),today.getMonth()+offset,1),year=d.getFullYear(),month=d.getMonth(),start=(d.getDay()+6)%7,days=new Date(year,month+1,0).getDate(),dots=[];for(let i=0;i<42;i++){let n=i-start+1,day=new Date(year,month,n),cls='dot';if(n<1||n>days)dots.push(`<i class="${cls} future"></i>`);else {if(h.dates.includes(dateKey(day)))cls+=' done';dots.push(`<button class="${cls}" data-week-id="${h.id}" data-week-date="${dateKey(day)}" aria-label="Open week of ${dateKey(day)}"></button>`)}}return `<div class="mini-month"><label>${new Intl.DateTimeFormat('en-US',{month:'short'}).format(d)}</label><div class="dot-grid">${dots.join('')}</div></div>`}
function renderRecords(){let aggregate={possible:0,done:0};habits.forEach(h=>{let x=recordMetrics(h);aggregate.possible+=x.possible;aggregate.done+=x.done});let green=Math.max(0,...habits.map(h=>streakFor(h)));$('#summaryCard').innerHTML=`<div class="summary-item"><span>Current streak</span><b>${green} days</b></div><div class="summary-item"><span>Completion rate</span><b>${aggregate.possible?Math.round(aggregate.done/aggregate.possible*100):0}%</b></div><div class="summary-item"><span>Total check-ins</span><b>${aggregate.done}</b></div>`;$('#recordList').innerHTML=habits.map(h=>{let x=recordMetrics(h);return `<article class="record-card" style="--accent:${h.color}"><div class="record-title"><i class="record-mark" style="background:${h.color}"></i><h2>${h.emoji} ${h.name}</h2><span class="record-year">${today.getFullYear()}</span></div><div class="mini-months">${miniMonth(h,-2)}${miniMonth(h,-1)}${miniMonth(h,0)}</div><div class="record-stats"><div><span>Month rate</span><b>${x.rate}%</b></div><div><span>Check-ins</span><b>${x.done}</b></div><div><span>Current run</span><b>${x.current}d</b></div></div></article>`}).join('')}
function openWeek(id,iso){activeWeek={id,iso};let h=habits.find(x=>x.id===id),start=new Date(`${iso}T12:00`),shift=(start.getDay()+6)%7;start.setDate(start.getDate()-shift);$('#weekHabitName').textContent=`${h.emoji} ${h.name}`;let end=new Date(start);end.setDate(end.getDate()+6);$('#weekRange').textContent=`${new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric'}).format(start)} – ${new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(end)}`;$('#weekCalendar').style.setProperty('--accent',h.color);$('#weekCalendar').innerHTML=Array.from({length:7},(_,i)=>{let d=new Date(start);d.setDate(d.getDate()+i);let isoDay=dateKey(d),done=h.dates.includes(isoDay),future=d>today;return `<div class="week-day"><span>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</span><button class="${done?'done':''}" data-toggle-date="${isoDay}" ${future?'disabled':''}>${d.getDate()}</button></div>`}).join('');show('weekSheet')}
function moveWeek(amount){if(!activeWeek)return;let d=new Date(`${activeWeek.iso}T12:00`);d.setDate(d.getDate()+amount*7);openWeek(activeWeek.id,dateKey(d))}
function switchScreen(name){$('.screen.active').classList.remove('active');$(`#${name}Screen`).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));if(name==='records')renderRecords()}
function show(id){$('#'+id).classList.add('show')}function hide(id){$('#'+id).classList.remove('show');if(id==='weekSheet')activeWeek=null}
$('#habitList').addEventListener('click',e=>{let b=e.target.closest('.habit');if(!b)return;e.target.closest('.check')?toggle(b.dataset.id):open(b.dataset.id)});$('#addHabit').onclick=()=>{ $('#habitForm').reset();$('#habitId').value='';$('#emoji').value='🌿';setColor('#84A5A8');$('#formTitle').textContent='New habit';$('#deleteHabit').hidden=true;show('formSheet')};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));$('#prevMonth').onclick=()=>{shownMonth.setMonth(shownMonth.getMonth()-1);renderDetail()};$('#nextMonth').onclick=()=>{shownMonth.setMonth(shownMonth.getMonth()+1);renderDetail()};$('#prevWeek').onclick=()=>moveWeek(-1);$('#nextWeek').onclick=()=>moveWeek(1);$('#openOverview').onclick=()=>switchScreen('records');document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchScreen(t.dataset.tab));$('#calendar').addEventListener('click',e=>{let b=e.target.closest('[data-month-date]');if(b&&!b.disabled)toggleDate(activeId,b.dataset.monthDate)});$('#recordList').addEventListener('click',e=>{let b=e.target.closest('[data-week-date]');if(b)openWeek(b.dataset.weekId,b.dataset.weekDate)});$('#weekCalendar').addEventListener('click',e=>{let b=e.target.closest('[data-toggle-date]');if(b&&!b.disabled)toggleDate(activeWeek.id,b.dataset.toggleDate)});$('#colorPalette').addEventListener('click',e=>{let b=e.target.closest('[data-color]');if(b)setColor(b.dataset.color)});
$('#editHabit').onclick=()=>{let h=habits.find(x=>x.id===activeId);$('#habitId').value=h.id;$('#emoji').value=h.emoji;$('#name').value=h.name;$('#frequency').value=h.frequency;setColor(h.color||'#647889');$('#note').value=h.note||'';$('#formTitle').textContent='Edit habit';$('#deleteHabit').hidden=false;hide('detailSheet');show('formSheet')};$('#habitForm').onsubmit=e=>{e.preventDefault();let id=$('#habitId').value,h=habits.find(x=>x.id===id);let data={emoji:$('#emoji').value||'🌿',name:$('#name').value.trim(),frequency:$('#frequency').value,note:$('#note').value.trim(),color:$('#color').value};if(h)Object.assign(h,data);else {h={id:crypto.randomUUID(),dates:[],...data};habits.push(h)}save();hide('formSheet');renderHome();renderRecords();};$('#deleteHabit').onclick=()=>{let id=$('#habitId').value; habits=habits.filter(h=>h.id!==id);save();hide('formSheet');renderHome();renderRecords();};$('#deleteFromDetail').onclick=()=>{habits=habits.filter(h=>h.id!==activeId);save();hide('detailSheet');renderHome();renderRecords();};renderPalette();renderHome();
</script></body></html>
